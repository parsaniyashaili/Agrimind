<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AgriMind AI 🌱 Smart Farming</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Gujarati:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#238a4d;--gd:#0f3d26;--gl:#e3f5e9;--bg:#eef7f1;--c:#fff;--m:#5d7066;--l:#d4e6da;--r:#c94b4b;--a:#c98410;--sun:#f6b92b;--t:#17301f;--soil:#5a3a22;--ease:cubic-bezier(.22,.8,.24,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1b14;--c:#16281e;--l:#27402f;--t:#e6f3ea;--m:#93aa9b;--gl:#1d3a29;--gd:#bfe9cd}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font:500 18px/1.45 "Baloo 2","Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:54px;border:0;border-radius:16px;padding:0 20px;font-weight:700;cursor:pointer;background:var(--gl);color:var(--gd);transition:transform .2s var(--ease),background .3s,box-shadow .3s,color .3s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0f3d2622}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pri{background:var(--g);color:#fff}.dng{background:#fde8e8;color:var(--r)}
a{color:inherit}[hidden]{display:none!important}
/* language */
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:20px;overflow:auto;transition:opacity .6s var(--ease),visibility .6s}
#lg.hide{opacity:0;visibility:hidden;pointer-events:none}
.lbox{max-width:460px;width:100%;text-align:center;animation:up .7s var(--ease) both}
.lbox .lgi{font-size:64px;animation:pop 2.4s ease-in-out infinite}.lbox h1{margin:0;font-size:44px;color:var(--gd)}
.lbox p{margin:6px 0 16px}.lbox .lb{display:grid;gap:12px;margin:18px 0}.lbox .lb button{font-size:24px;min-height:64px;background:var(--c);border:2px solid var(--l)}.lbox .lb button:hover{background:var(--g);color:#fff}
.lbox small{display:block;color:var(--m);font-size:13px;line-height:1.35;margin-top:6px}
@keyframes pop{50%{transform:translateY(-8px) rotate(6deg)}}
#lgb{position:fixed;top:calc(10px + env(safe-area-inset-top,0));right:10px;z-index:60;min-height:44px;padding:0 14px;border-radius:30px;background:var(--c);border:2px solid var(--l);box-shadow:0 4px 14px #0003}
/* hero */
#hero{height:600vh;position:relative;background:linear-gradient(#bfe6f7,#e9f8ee 70%)}
.stick{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
.hint{position:absolute;bottom:22%;left:0;right:0;text-align:center;font-size:22px;font-weight:800;color:#0f3d26;animation:b 1.6s ease-in-out infinite;transition:opacity .4s}
@keyframes b{50%{transform:translateY(10px)}}
.title{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;will-change:transform,opacity}
.title h1{font-size:clamp(38px,8vw,84px);line-height:1.05;margin:0;color:#0f3d26;font-weight:800}
.title p{font-size:clamp(18px,3vw,26px);margin:12px 0 24px;color:#25503a}
.title button{pointer-events:auto;font-size:22px;min-height:64px}
#sc{position:absolute;inset:0;width:100%;height:100%}#sc g{will-change:transform,opacity}
.cap{position:absolute;top:9%;left:0;right:0;text-align:center;font-size:clamp(22px,4vw,40px);font-weight:800;color:#fff;text-shadow:0 2px 12px #000a}.title h1,.title p{text-shadow:0 2px 14px #fffc}
/* app */
#app{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;background:var(--bg);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 86px;display:grid;place-items:center;padding:8px 6px;min-height:72px;line-height:1.1;font-size:14px;background:var(--c);border:2px solid var(--l)}
.tabs button b{font-size:28px}.tabs .on{background:var(--g);color:#fff;border-color:var(--g)}
.view{display:none}.view.on{display:block}
.view.on>*{animation:up .55s var(--ease) both}.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(5){animation-delay:.2s}.view.on>*:nth-child(n+6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h2{font-size:30px;margin:14px 0 6px;color:var(--gd)}.mu{color:var(--m);font-size:15px}
.card{background:var(--c);border:2px solid var(--l);border-radius:20px;padding:18px;margin:12px 0;transition:box-shadow .3s,transform .3s var(--ease)}
.card:hover{box-shadow:0 8px 22px #0f3d2614}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.met{text-align:center}.met b{display:block;font-size:34px}.met span{font-size:34px}.met small{display:block;color:var(--m);font-size:15px}
.bar{height:12px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .9s var(--ease)}
.big{font-size:26px;font-weight:800}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.row .e{font-size:36px}.row div{flex:1}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.acts button{flex:1 1 150px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fld label{display:block;font-weight:700;margin-bottom:4px}
.fld input,.fld select,.fld textarea,.in{width:100%;min-height:54px;border:2px solid var(--l);border-radius:14px;padding:0 14px;background:var(--c);transition:border-color .25s,box-shadow .25s}
.fld textarea{padding:12px 14px;min-height:120px;resize:vertical}.full{grid-column:1/-1}
.emo{display:flex;gap:8px}.emo button{flex:1;font-size:15px;min-height:64px;background:var(--c);border:2px solid var(--l);padding:4px}
.msg{padding:14px;border-radius:14px;margin:10px 0;background:var(--gl);animation:up .4s var(--ease) both}.msg.w{background:#fff3d6;color:#6a4708}.msg.e{background:#fde8e8;color:#8f2b2b}
.crops{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.cc .hd{cursor:pointer;text-align:center}.cc .hd .e{font-size:56px;transition:transform .35s var(--ease)}.cc:hover .hd .e{transform:scale(1.12) rotate(-4deg)}.cc .hd small{display:block;color:var(--m);font-size:14px}
.cc .det{display:none;margin-top:10px;border-top:1px solid var(--l);padding-top:10px}.cc.open .det{display:block;animation:up .4s var(--ease) both}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}.kv span:nth-child(odd){color:var(--m)}
.cc .acts button{min-height:46px;font-size:15px;flex:1 1 120px}
table{width:100%;border-collapse:collapse;font-size:16px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--l)}
.photo{display:block;border:3px dashed var(--l);border-radius:18px;padding:30px;text-align:center;cursor:pointer;transition:background .3s,border-color .3s}.photo:hover{background:var(--gl);border-color:var(--g)}.photo input{display:none}
canvas{max-width:100%;border-radius:12px;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto;margin-bottom:10px;scroll-behavior:smooth}.b{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;animation:up .35s var(--ease) both}.b.u{align-self:flex-end;background:var(--g);color:#fff}.b.a{background:var(--gl)}
summary{font-weight:700;cursor:pointer}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips button{min-height:44px;font-size:15px;padding:0 14px}.chips button.on{background:var(--g);color:#fff}
.acts .in{flex:2 1 200px}
.stars{display:flex;gap:6px;margin:8px 0}.stars button{min-height:50px;font-size:28px;padding:0 10px;background:var(--c);border:2px solid var(--l)}.stars button.on{background:#fff3d6;border-color:var(--sun)}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pr .card{text-align:center;margin:0}.pr .e{font-size:44px}.pr b{display:block;font-size:20px}.pr span{font-size:15px;color:var(--m)}
.sch{display:flex;gap:12px;align-items:flex-start}.sch .e{font-size:40px}.sch div{flex:1}.sch a{display:inline-block;margin-top:6px;font-weight:700;color:var(--g)}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-top:10px}.ck input{width:24px;height:24px;margin-top:3px;flex:none}
footer{text-align:center;color:var(--m);font-size:14px;padding:24px 0 10px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form,.crops,.pr{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style></head><body>

<div id="lg"><div class="lbox"><div class="lgi">🌱</div><h1>AgriMind</h1>
<p>Choose your language • भाषा चुनें • ભાષા પસંદ કરો</p>
<div class="lb"><button data-l="0">English</button><button data-l="1">हिन्दी</button><button data-l="2">ગુજરાતી</button></div>
<div id="lgn"></div></div></div>
<button id="lgb" aria-label="Language">🌐 EN</button>

<section id="hero"><div class="stick"><svg id="sc" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" aria-label="Earth zooming into a farm and a tree">
<defs><radialGradient id="oc" cx=".35" cy=".3"><stop offset="0" stop-color="#58b6ff"/><stop offset="1" stop-color="#0a3585"/></radialGradient>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9fe6"/><stop offset="1" stop-color="#dcf3ff"/></linearGradient>
<linearGradient id="bk" x1="0" x2="1"><stop offset="0" stop-color="#3d2514"/><stop offset=".45" stop-color="#8d6038"/><stop offset="1" stop-color="#3a2312"/></linearGradient>
<radialGradient id="cn" cx=".4" cy=".35"><stop offset="0" stop-color="#78d46f"/><stop offset="1" stop-color="#17622a"/></radialGradient>
<clipPath id="gc"><circle cx="400" cy="250" r="120"/></clipPath></defs>
<rect width="800" height="500" fill="#02040d"/><g id="st"></g>
<g id="fg"><rect width="800" height="300" fill="url(#sk)"/><text x="90" y="90" font-size="50">☁️</text><text x="560" y="130" font-size="40">☁️</text>
<path d="M0 300Q150 230 300 300Q450 240 600 300Q700 260 800 300V310H0Z" fill="#5d9c4a"/><rect y="300" width="800" height="200" fill="#6fb552"/><g id="rw" stroke="#3f8a35" stroke-width="3"></g>
<text x="120" y="305" font-size="46">🏡</text><text x="610" y="400" font-size="42">🚜</text><text x="40" y="440" font-size="30">🌾🌾🌾</text></g>
<g id="gl"><circle cx="400" cy="250" r="128" fill="none" stroke="#7cc8ff" stroke-width="6" opacity=".35"/><circle cx="400" cy="250" r="120" fill="url(#oc)"/>
<g clip-path="url(#gc)" fill="#3a9d4f"><path d="M360 230q15-25 40-15q20 15 10 45q-10 30-30 40q-25-15-20-70z"/><path d="M410 170q40-20 70 10q10 30-15 50q-20 10-40-5q-25-10-15-55z"/><path d="M290 180q25-20 35 10q-5 30-20 45q-20 20-25-10q-5-25 10-45z"/><path d="M370 175q20-15 35-2q-10 15-30 15z"/></g>
<circle cx="440" cy="235" r="3" fill="#ff4d4d"><animate attributeName="r" values="2;7;2" dur="1.2s" repeatCount="indefinite"/></circle></g>
<g id="tg"></g><circle id="fl" cx="400" cy="290" r="0" fill="#fff"/></svg>
<div class="cap" id="cap"></div><div class="hint" id="hint">🌍 <span data-i="scroll"></span> ⬇️</div>
<div class="title" id="ttl"><h1>🌱 <span data-i="h1"></span></h1><p data-i="hsub"></p><button class="pri" id="startb">🚜 <span data-i="start"></span></button></div>
</div></section>

<div id="app">
<div class="tabs" id="tabs">
<button class="on" data-v="home"><b>🏠</b><span data-i="t_home"></span></button>
<button data-v="entry"><b>📝</b><span data-i="t_entry"></span></button>
<button data-v="advice"><b>🤖</b><span data-i="t_advice"></span></button>
<button data-v="scan"><b>📷</b><span data-i="t_scan"></span></button>
<button data-v="crops"><b>🌾</b><span data-i="t_crops"></span></button>
<button data-v="bud"><b>💰</b><span data-i="t_bud"></span></button>
<button data-v="chat"><b>💬</b><span data-i="t_chat"></span></button>
<button data-v="schemes"><b>🏛️</b><span data-i="t_schemes"></span></button>
<button data-v="tools"><b>🧰</b><span data-i="t_tools"></span></button>
<button data-v="enq"><b>✉️</b><span data-i="t_enq"></span></button>
<button data-v="hist"><b>📊</b><span data-i="t_hist"></span></button>
<button data-v="about"><b>📞</b><span data-i="t_about"></span></button>
</div>

<section id="home" class="view on">
<h2>👋 <span data-i="farm_today"></span></h2><div class="mu" id="mode"></div>
<div class="grid">
<div class="card met"><span>🌡️</span><b id="mT">--</b><small data-i="heat"></small></div>
<div class="card met"><span>💧</span><b id="mM">--</b><small data-i="swater"></small><div class="bar"><i id="mB" style="width:0"></i></div></div>
<div class="card met"><span>💦</span><b id="mH">--</b><small data-i="awet"></small></div>
<div class="card met"><span>🧪</span><b id="mP">--</b><small data-i="sph"></small></div></div>
<div class="card"><div class="big">🤖 <span data-i="what_now"></span></div><div id="dec" class="msg"></div>
<div class="acts"><button class="pri" data-go="entry">📝 <span data-i="enter_today"></span></button><button onclick="speak()">🔊 <span data-i="listen"></span></button></div></div>
<div class="card"><div class="big">🌦️ <span data-i="wx_title"></span></div><div id="wx" class="mu" style="margin-top:6px"></div>
<div class="acts"><button class="pri" onclick="wxGo()">📍 <span data-i="wx_btn"></span></button><button id="wxf" hidden onclick="wxFill()">📝 <span data-i="wx_fill"></span></button></div></div>
<div class="card"><div class="big">🌱 <span data-i="sow_now"></span></div><div id="sow" class="chips" style="margin-top:10px"></div></div>
<div class="card"><div class="big">🚿 <span data-i="pump"></span></div><p id="pumpt" class="mu"></p>
<div class="acts"><button class="pri" onclick="pump(1)">💧 <span data-i="start_water"></span></button><button class="dng" onclick="pump(0)">⛔ <span data-i="stop_water"></span></button></div></div>
<div class="card"><div class="big">💡 <span data-i="tip_day"></span></div><p id="tip"></p></div>
</section>

<section id="entry" class="view"><h2>📝 <span data-i="e_title"></span></h2><div class="mu" data-i="e_hint"></div>
<form id="f" class="card form">
<div class="fld"><label>🌡️ <span data-i="f_temp"></span></label><input name="temperature" type="number" step=".1" min="-10" max="60" required placeholder="30"></div>
<div class="fld"><label>💦 <span data-i="f_hum"></span></label><input name="humidity" type="number" step=".1" min="0" max="100" required placeholder="55"></div>
<div class="fld full"><label>💧 <span data-i="f_sm"></span></label><input name="soil_moisture" id="sm" type="number" step=".1" min="0" max="100" required placeholder="35">
<div class="emo" style="margin-top:8px"><button type="button" data-sm="15">🏜️<br><span data-i="dry"></span></button><button type="button" data-sm="45">🙂<br><span data-i="good"></span></button><button type="button" data-sm="75">🌧️<br><span data-i="wet"></span></button></div></div>
<div class="fld"><label>🧪 <span data-i="sph"></span></label><input name="ph" type="number" step=".1" min="0" max="14" required value="6.5"></div>
<div class="fld"><label>☀️ <span data-i="f_sun"></span></label><input name="light_hours" type="number" step=".1" min="0" max="24" value="6" required></div>
<div class="fld"><label>🪣 <span data-i="f_tank"></span></label><input name="water_level" type="number" step=".1" min="0" max="100" value="70" required></div>
<div class="fld"><label>📐 <span data-i="f_area"></span></label><input name="area" type="number" step=".01" min=".01" value="1" required></div>
<div class="fld full"><label>🌾 <span data-i="f_crop"></span></label><select name="crop"></select></div>
<div class="fld full"><label>🗒️ <span data-i="f_notes"></span></label><input name="notes" data-p="f_notes_ph"></div>
<div class="full acts"><button class="pri" type="submit">💾 <span data-i="save_adv"></span></button><button type="reset">🧹 <span data-i="clear"></span></button></div></form><div id="fm"></div></section>

<section id="advice" class="view"><h2>🤖 <span data-i="a_title"></span></h2><div class="card" id="ab"></div><div class="acts"><button onclick="speak()">🔊 <span data-i="read"></span></button></div></section>

<section id="scan" class="view"><h2>📷 <span data-i="s_title"></span></h2><div class="mu" data-i="s_hint"></div>
<div class="card"><div class="form"><div class="fld"><label>🌾 <span data-i="s_crop"></span></label><select id="dcrop"></select></div><div class="fld"><label>📐 <span data-i="s_land"></span></label><input id="dac" type="number" step=".01" min=".01" value="1"></div></div>
<label class="photo" style="margin-top:12px"><div style="font-size:56px">🍃</div><b data-i="s_tap"></b><input id="leaf" type="file" accept="image/*" capture="environment"></label><canvas id="cv" hidden></canvas><div id="sr"></div>
<p class="mu">ℹ️ <span data-i="s_note"></span></p></div><h2>🦠 <span data-i="d_title"></span></h2><div id="dg"></div></section>

<section id="crops" class="view"><h2>🌾 <span data-i="c_title"></span></h2><div class="mu" data-i="c_hint"></div>
<div class="card"><input id="cs" class="in" data-p="c_search"><div class="chips" id="cc" style="margin:10px 0 0"></div></div><div class="crops" id="cg"></div></section>

<section id="bud" class="view"><h2>💰 <span data-i="b_title"></span></h2><div class="mu" data-i="b_hint"></div>
<div class="card form"><div class="fld full"><label>🌱 <span data-i="b_plant"></span></label><select id="bn"></select></div><div class="fld full"><label>📐 <span data-i="s_land"></span></label><input id="ba" type="number" step=".01" min=".01" value="1"></div></div><div id="bo"></div></section>

<section id="chat" class="view"><h2>💬 <span data-i="ch_title"></span></h2><div class="mu" data-i="ch_hint"></div>
<details class="card" id="kbox"><summary>🔑 <span data-i="ch_key"></span></summary><p class="mu" data-i="ch_keyhint"></p><div class="acts"><input id="gk" class="in" type="password" data-p="ch_keyph"><button class="pri" id="gks"></button></div></details>
<div class="card"><div class="chat" id="cm"><div class="b a">🙏 <span data-i="ch_hi"></span></div></div>
<div class="chips"><button data-q="ch_q1t">🍃 <span data-i="ch_q1"></span></button><button data-q="ch_q2t">💧 <span data-i="ch_q2"></span></button><button data-q="ch_q3t">🐛 <span data-i="ch_q3"></span></button></div>
<div class="acts"><input id="ci" class="in" data-p="ch_ph"><button class="pri" onclick="ask()">📤 <span data-i="send"></span></button></div></div></section>

<section id="schemes" class="view"><h2>🏛️ <span data-i="sc_title"></span></h2><div class="mu" data-i="sc_hint"></div><div id="scl"></div></section>

<section id="tools" class="view"><h2>🧰 <span data-i="tl_title"></span></h2>

tp_pul:["Pulses fix nitrogen. Avoid water-logging and treat the seed.","दालें नाइट्रोजन बनाती हैं। जलभराव से बचें और बीज उपचार करें।","કઠોળ નાઇટ્રોજન બનાવે છે. પાણી ભરાવો ટાળો અને બીજ માવજત કરો."],
tp_oil:["Sow on time. Give light water at flowering and pod filling.","समय पर बोएँ। फूल और फली भरते समय हल्का पानी दें।","સમયસર વાવો. ફૂલ અને શિંગ ભરાતી વખતે હળવું પાણી આપો."],
tp_veg:["Use mulch, drip water and check under leaves for insects daily.","मल्चिंग और ड्रिप का उपयोग करें, रोज़ पत्तों के नीचे कीट देखें।","મલ્ચિંગ અને ટપક સિંચાઈ વાપરો, રોજ પાંદડા નીચે જીવાત જુઓ."],
tp_fru:["Prune on time, add compost every year and protect young plants from heat and frost.","समय पर कटाई-छँटाई करें, हर साल कम्पोस्ट डालें, छोटे पौधों को गर्मी-पाले से बचाएँ।","સમયસર કાપકૂપ કરો, દર વર્ષે કમ્પોસ્ટ નાખો, નાના છોડને ગરમી-હિમથી બચાવો."],
tp_spi:["Use disease-free seed or rhizome. Good drainage is a must; dry well before storing.","रोगमुक्त बीज/गाँठ लें। पानी निकासी ज़रूरी है; भंडारण से पहले अच्छे से सुखाएँ।","રોગમુક્ત બીજ/ગાંઠ વાપરો. પાણીનો નિકાલ જરૂરી; સંગ્રહ પહેલાં સારી રીતે સૂકવો."],
tp_cash:["Plan water and labour early; sell at the notified price (MSP/FRP) where available.","पानी और मज़दूरी की पहले योजना बनाएँ; जहाँ उपलब्ध हो घोषित भाव (MSP/FRP) पर बेचें।","પાણી અને મજૂરીનું વહેલું આયોજન કરો; જ્યાં હોય ત્યાં જાહેર ભાવ (MSP/FRP) પર વેચો."],
tp_pla:["Long-term crop: use good planting material and give regular care for years.","लंबे समय की फसल: अच्छे पौधे लगाएँ और वर्षों तक नियमित देखभाल करें।","લાંબા ગાળાનો પાક: સારા રોપા વાપરો અને વર્ષો સુધી નિયમિત કાળજી લો."],

 sendMail('Question (Ask AI)',{question:q,latest_crop:rows[0]?CR[rows[0].crop].n[0]:'-'});
 const w=msg(t('think'),'a'),k=gkey();
 try{H.push({role:'user',parts:[{text:q}]});let a='';
  if(k){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:sysP()}]},contents:H.slice(-12)})});
   const j=await r.json();if(j.error)throw new Error(j.error.message);
   a=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim()}
  else a=String(await aiFree()).trim();
  if(!a)throw new Error('empty answer');
  H.push({role:'model',parts:[{text:a}]});w.textContent=a;$('#cm').scrollTop=1e9}
 catch(e){H.pop();w.textContent=t('ch_err',e.message)}}
